name: Bug report
description: Report a reproducible StormRelay defect
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: impact
    attributes: {label: Impact, description: What failed and who was affected?}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction, description: Include sanitized steps and configuration. Never include credentials or raw sensitive payloads.}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Version or commit SHA}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes: {label: Sanitized logs and request ID}
