name: Feature proposal
description: Propose a user problem and a bounded change
title: "[Proposal]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: Describe the operational problem, not only a preferred implementation.}
    validations: {required: true}
  - type: textarea
    id: scope
    attributes: {label: Proposed scope}
    validations: {required: true}
  - type: textarea
    id: safety
    attributes: {label: Reliability and security considerations}
