name: Upgrade Drill

on:
  pull_request:
    paths:
      - "internal/storage/**"
      - ".github/workflows/upgrade-drill.yml"
      - "Makefile"
      - "ROADMAP.md"
      - "CHANGELOG.md"
  push:
    branches: [main]
    paths:
      - "internal/storage/**"
      - ".github/workflows/upgrade-drill.yml"
      - "Makefile"
      - "ROADMAP.md"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upgrade-drill-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-v6-to-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stormrelay
          POSTGRES_USER: stormrelay
          POSTGRES_PASSWORD: stormrelay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stormrelay -d stormrelay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@ba097532fb203f7e88c9c3c0b899b49469908a92
        with:
          persist-credentials: false
      - uses: actions/setup-go@78961f6f84d799cd858575bb931c3e51d3b13290
        with:
          go-version: 1.26.x
          cache: false
      - name: Verify dependency lock
        run: go mod verify
      - name: Run schema and data upgrade drill
        shell: bash
        env:
          STORMRELAY_TEST_DATABASE_URL: postgres://stormrelay:stormrelay@localhost:5432/stormrelay?sslmode=disable
        run: |
          set -o pipefail
          go test -tags=upgrade -count=1 -run '^TestUpgradeFromVersion6ToCurrent$' -v ./internal/storage 2>&1 | tee upgrade-drill.log
      - name: Upload sanitized upgrade diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: upgrade-drill-diagnostics
          path: upgrade-drill.log
          if-no-files-found: warn
          retention-days: 1
