name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 2'
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@ba097532fb203f7e88c9c3c0b899b49469908a92
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@c7c896d71b3055d36f2aff93b16bcc6c69923b91
        with:
          languages: go
      - uses: github/codeql-action/autobuild@c7c896d71b3055d36f2aff93b16bcc6c69923b91
      - uses: github/codeql-action/analyze@c7c896d71b3055d36f2aff93b16bcc6c69923b91
