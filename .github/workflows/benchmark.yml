name: Benchmark Harness
on:
  pull_request:
    paths:
      - "internal/events/**"
      - "internal/policies/**"
      - "internal/storage/**"
      - "internal/api/**"
      - "internal/worker/**"
      - "deploy/compose/**"
      - "tests/load/**"
      - ".github/workflows/benchmark.yml"
      - "Makefile"
  push:
    branches: [main]
    paths:
      - "internal/events/**"
      - "internal/policies/**"
      - "internal/storage/**"
      - "internal/api/**"
      - "internal/worker/**"
      - "deploy/compose/**"
      - "tests/load/**"
      - ".github/workflows/benchmark.yml"
      - "Makefile"
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark profile
        required: true
        default: correctness
        type: choice
        options:
          - correctness
          - full
permissions:
  contents: read
concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}-${{ inputs.profile || 'correctness' }}
  cancel-in-progress: true
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BENCHMARK_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'correctness' }}
      STORMRELAY_BENCHMARK_OUTPUT_DIR: ${{ github.workspace }}/.benchmark-results/${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'correctness' }}
    steps:
      - uses: actions/checkout@ba097532fb203f7e88c9c3c0b899b49469908a92
        with:
          persist-credentials: false
      - uses: actions/setup-go@78961f6f84d799cd858575bb931c3e51d3b13290
        with:
          go-version: 1.26.x
          cache: false
      - name: Verify dependency lock
        run: go mod verify
      - name: Validate benchmark harness sources
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/load/run-profile.sh
          python3 -m py_compile tests/load/capture_result.py tests/load/validate_result.py
          python3 -m json.tool tests/load/result.schema.json >/dev/null
          python3 -m json.tool tests/load/profiles/correctness.json >/dev/null
          python3 -m json.tool tests/load/profiles/full.json >/dev/null
      - name: Run benchmark profile
        shell: bash
        run: bash tests/load/run-profile.sh "$BENCHMARK_PROFILE"
      - name: Upload benchmark result and raw measurements
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: benchmark-${{ env.BENCHMARK_PROFILE }}-${{ github.sha }}
          path: .benchmark-results/${{ env.BENCHMARK_PROFILE }}
          if-no-files-found: warn
          retention-days: 14
