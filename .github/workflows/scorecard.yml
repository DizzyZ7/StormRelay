name: OpenSSF Scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: '29 4 * * 1'
  push:
    branches: [main]
permissions: read-all
jobs:
  analysis:
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@ba097532fb203f7e88c9c3c0b899b49469908a92
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@50757822a4ac41af1c2f5572df4e1c1a5ae50c03
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@c7c896d71b3055d36f2aff93b16bcc6c69923b91
        with:
          sarif_file: results.sarif
