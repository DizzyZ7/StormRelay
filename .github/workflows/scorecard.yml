name: OpenSSF Scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: '29 4 * * 1'
  push:
    branches: [main]
permissions: read-all
jobs:
  analysis:
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@ba097532fb203f7e88c9c3c0b899b49469908a92
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@3e3b6389530b032cf1fd0d2adacb70fd8cb4e402
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@85830a2768c17af843348fb4e07bffeb014298ce
        with:
          sarif_file: results.sarif
