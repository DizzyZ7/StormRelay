name: Failure Injection
on:
  pull_request:
    paths:
      - "cmd/stormrelay-server/**"
      - "cmd/stormrelay-worker/**"
      - "internal/api/**"
      - "internal/config/**"
      - "internal/ingestion/**"
      - "internal/messaging/**"
      - "internal/notifications/**"
      - "internal/plugins/**"
      - "internal/runbookengine/**"
      - "internal/storage/**"
      - "internal/worker/**"
      - "deploy/compose/**"
      - "tests/failure/**"
      - "tests/integration/vertical_test.go"
      - ".github/workflows/failure-injection.yml"
      - "Makefile"
  push:
    branches: [main]
    paths:
      - "cmd/stormrelay-server/**"
      - "cmd/stormrelay-worker/**"
      - "internal/api/**"
      - "internal/config/**"
      - "internal/ingestion/**"
      - "internal/messaging/**"
      - "internal/notifications/**"
      - "internal/plugins/**"
      - "internal/runbookengine/**"
      - "internal/storage/**"
      - "internal/worker/**"
      - "deploy/compose/**"
      - "tests/failure/**"
      - "tests/integration/vertical_test.go"
      - ".github/workflows/failure-injection.yml"
      - "Makefile"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: failure-injection-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  state-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stormrelay
          POSTGRES_USER: stormrelay
          POSTGRES_PASSWORD: stormrelay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stormrelay -d stormrelay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@ba097532fb203f7e88c9c3c0b899b49469908a92
        with:
          persist-credentials: false
      - uses: actions/setup-go@78961f6f84d799cd858575bb931c3e51d3b13290
        with:
          go-version: 1.26.x
          cache: false
      - name: Verify dependency lock
        run: go mod verify
      - name: Start NATS JetStream
        run: docker run --detach --name stormrelay-failure-nats --publish 4222:4222 nats:2.11-alpine -js
      - name: Inject plugin and notification provider failures
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -v ./internal/plugins ./internal/notifications 2>&1 | tee failure-adapters.log
      - name: Verify concurrent duplicate audit invariants
        shell: bash
        env:
          STORMRELAY_TEST_DATABASE_URL: postgres://stormrelay:stormrelay@localhost:5432/stormrelay?sslmode=disable
          STORMRELAY_TEST_NATS_URL: nats://localhost:4222
        run: |
          set -o pipefail
          go test -tags=integration -count=1 -run '^TestConcurrentDuplicateProcessingCreatesOneCanonicalEvent$' -v ./tests/integration 2>&1 | tee failure-dedup.log
      - name: Run poison-message and runbook recovery tests
        shell: bash
        env:
          STORMRELAY_TEST_DATABASE_URL: postgres://stormrelay:stormrelay@localhost:5432/stormrelay?sslmode=disable
          STORMRELAY_TEST_NATS_URL: nats://localhost:4222
        run: |
          set -o pipefail
          go test -tags=failure -count=1 -v ./tests/failure 2>&1 | tee failure-state.log
      - name: Upload state recovery diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: failure-state-diagnostics
          path: |
            failure-adapters.log
            failure-dedup.log
            failure-state.log
          if-no-files-found: warn
          retention-days: 1

  dependency-outages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@ba097532fb203f7e88c9c3c0b899b49469908a92
        with:
          persist-credentials: false
      - name: Validate outage drill shell syntax
        run: bash -n ./tests/failure/dependency-outages.sh
      - name: Run PostgreSQL and NATS outage drill
        shell: bash
        run: |
          set -o pipefail
          bash ./tests/failure/dependency-outages.sh 2>&1 | tee failure-dependencies.log
      - name: Upload dependency outage diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: failure-dependency-diagnostics
          path: failure-dependencies.log
          if-no-files-found: warn
          retention-days: 1
