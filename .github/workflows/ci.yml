name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@ba097532fb203f7e88c9c3c0b899b49469908a92
        with:
          persist-credentials: false
      - uses: actions/setup-go@78961f6f84d799cd858575bb931c3e51d3b13290
        with:
          go-version: 1.26.x
          cache: false
      - name: Verify dependency lock
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify
      - name: Format check
        shell: bash
        run: |
          set -o pipefail
          gofmt -w .
          git diff --exit-code -- '*.go' | tee gofmt.patch
      - name: Vet
        shell: bash
        run: |
          set -o pipefail
          go vet ./... 2>&1 | tee vet.log
      - name: Unit tests with race detector
        shell: bash
        run: |
          set -o pipefail
          go test -race -count=1 ./... 2>&1 | tee unit.log
      - name: Build binaries
        shell: bash
        run: |
          set -o pipefail
          {
            go build -trimpath ./cmd/stormrelay-server
            go build -trimpath ./cmd/stormrelay-worker
            go build -trimpath ./cmd/stormrelay-cli
          } 2>&1 | tee build.log
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: unit-diagnostics
          path: |
            gofmt.patch
            vet.log
            unit.log
            build.log
          if-no-files-found: warn
          retention-days: 1

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stormrelay
          POSTGRES_USER: stormrelay
          POSTGRES_PASSWORD: stormrelay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stormrelay -d stormrelay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@ba097532fb203f7e88c9c3c0b899b49469908a92
        with:
          persist-credentials: false
      - uses: actions/setup-go@78961f6f84d799cd858575bb931c3e51d3b13290
        with:
          go-version: 1.26.x
          cache: false
      - name: Verify dependency lock
        run: go mod verify
      - name: Start NATS JetStream
        run: docker run --detach --name stormrelay-nats --publish 4222:4222 nats:2.11-alpine -js
      - name: Integration tests
        shell: bash
        env:
          STORMRELAY_TEST_DATABASE_URL: postgres://stormrelay:stormrelay@localhost:5432/stormrelay?sslmode=disable
          STORMRELAY_TEST_NATS_URL: nats://localhost:4222
        run: |
          set -o pipefail
          go test -tags=integration -count=1 -v ./tests/integration 2>&1 | tee integration.log
      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: integration-diagnostics
          path: integration.log
          if-no-files-found: warn
          retention-days: 1

  compose-smoke:
    needs: [test, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@ba097532fb203f7e88c9c3c0b899b49469908a92
        with:
          persist-credentials: false
      - name: Run Docker Compose smoke test
        shell: bash
        run: |
          set -o pipefail
          ./tests/smoke-compose.sh 2>&1 | tee compose-smoke.log
      - name: Upload Compose diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: compose-diagnostics
          path: compose-smoke.log
          if-no-files-found: warn
          retention-days: 1
