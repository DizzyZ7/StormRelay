name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@ba097532fb203f7e88c9c3c0b899b49469908a92
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.x
          cache: false
      - name: Verify dependency lock
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests with race detector
        run: go test -race -count=1 ./...
      - name: Build binaries
        run: |
          go build -trimpath ./cmd/stormrelay-server
          go build -trimpath ./cmd/stormrelay-worker
          go build -trimpath ./cmd/stormrelay-cli

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stormrelay
          POSTGRES_USER: stormrelay
          POSTGRES_PASSWORD: stormrelay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stormrelay -d stormrelay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@ba097532fb203f7e88c9c3c0b899b49469908a92
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.x
          cache: false
      - name: Verify dependency lock
        run: go mod verify
      - name: Start NATS JetStream
        run: docker run --detach --name stormrelay-nats --publish 4222:4222 nats:2.11-alpine -js
      - name: Integration tests
        env:
          STORMRELAY_TEST_DATABASE_URL: postgres://stormrelay:stormrelay@localhost:5432/stormrelay?sslmode=disable
          STORMRELAY_TEST_NATS_URL: nats://localhost:4222
        run: go test -tags=integration -count=1 -v ./tests/integration

  compose-smoke:
    needs: [test, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@ba097532fb203f7e88c9c3c0b899b49469908a92
        with:
          persist-credentials: false
      - name: Run Docker Compose smoke test
        run: ./tests/smoke-compose.sh
