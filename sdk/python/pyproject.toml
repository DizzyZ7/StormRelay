[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stormrelay"
version = "0.1.0.dev0"
description = "Python client for the StormRelay incident control plane"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[tool.setuptools.packages.find]
where = ["."]
include = ["stormrelay*"]
