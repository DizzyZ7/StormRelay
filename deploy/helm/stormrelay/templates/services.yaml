apiVersion: v1
kind: Service
metadata:
  name: {{ include "stormrelay.fullname" . }}-server
  labels:
    {{- include "stormrelay.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "stormrelay.componentLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "server") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
---
{{- if .Values.workerService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stormrelay.fullname" . }}-worker
  labels:
    {{- include "stormrelay.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  {{- with .Values.workerService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.workerService.type }}
  selector:
    {{- include "stormrelay.componentLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "worker") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.workerService.port }}
      targetPort: http
      protocol: TCP
{{- end }}
