{{- if .Values.demoDependencies.enabled }}
{{- $secret := required "demoDependencies.existingSecret is required when demoDependencies.enabled=true" .Values.demoDependencies.existingSecret }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stormrelay.fullname" . }}-postgres
  labels:
    {{- include "stormrelay.labels" . | nindent 4 }}
    app.kubernetes.io/component: demo-postgres
spec:
  selector:
    {{- include "stormrelay.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: demo-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "stormrelay.fullname" . }}-postgres
  labels:
    {{- include "stormrelay.labels" . | nindent 4 }}
    app.kubernetes.io/component: demo-postgres
spec:
  serviceName: {{ include "stormrelay.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "stormrelay.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: demo-postgres
  template:
    metadata:
      labels:
        {{- include "stormrelay.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: demo-postgres
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ printf "%s:%s" .Values.demoDependencies.postgres.image.repository .Values.demoDependencies.postgres.image.tag | quote }}
          imagePullPolicy: {{ .Values.demoDependencies.postgres.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $secret | quote }}
                  key: {{ .Values.demoDependencies.postgres.usernameKey | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret | quote }}
                  key: {{ .Values.demoDependencies.postgres.passwordKey | quote }}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ $secret | quote }}
                  key: {{ .Values.demoDependencies.postgres.databaseKey | quote }}
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.demoDependencies.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      {{- if not .Values.demoDependencies.postgres.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.demoDependencies.postgres.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.demoDependencies.postgres.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.demoDependencies.postgres.persistence.size }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stormrelay.fullname" . }}-nats
  labels:
    {{- include "stormrelay.labels" . | nindent 4 }}
    app.kubernetes.io/component: demo-nats
spec:
  selector:
    {{- include "stormrelay.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: demo-nats
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: monitoring
      port: 8222
      targetPort: monitoring
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "stormrelay.fullname" . }}-nats
  labels:
    {{- include "stormrelay.labels" . | nindent 4 }}
    app.kubernetes.io/component: demo-nats
spec:
  serviceName: {{ include "stormrelay.fullname" . }}-nats
  replicas: 1
  selector:
    matchLabels:
      {{- include "stormrelay.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: demo-nats
  template:
    metadata:
      labels:
        {{- include "stormrelay.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: demo-nats
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nats
          image: {{ printf "%s:%s" .Values.demoDependencies.nats.image.repository .Values.demoDependencies.nats.image.tag | quote }}
          imagePullPolicy: {{ .Values.demoDependencies.nats.image.pullPolicy }}
          args: ["-js", "-sd", "/data", "-m", "8222"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          ports:
            - name: client
              containerPort: 4222
            - name: monitoring
              containerPort: 8222
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitoring
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitoring
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.demoDependencies.nats.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      {{- if not .Values.demoDependencies.nats.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.demoDependencies.nats.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.demoDependencies.nats.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.demoDependencies.nats.persistence.size }}
  {{- end }}
{{- end }}
