services:
  postgres:
    image: "${STORMRELAY_BENCHMARK_POSTGRES_IMAGE:-postgres:17-alpine}"
    command:
      - postgres
      - -c
      - "max_connections=${STORMRELAY_BENCHMARK_POSTGRES_MAX_CONNECTIONS:-100}"
    ports:
      - "${STORMRELAY_BENCHMARK_POSTGRES_PORT:-55432}:5432"

  nats:
    image: "${STORMRELAY_BENCHMARK_NATS_IMAGE:-nats:2.11-alpine}"
